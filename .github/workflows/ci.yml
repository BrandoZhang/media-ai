name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Sync
        run: uv sync
      - name: Lint
        run: uv run ruff check media_ai tests
      - name: Test (offline — no creds, no network)
        run: uv run pytest -q -m "not live"
