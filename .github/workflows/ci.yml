name: ci
on:
  push:
    branches: [main]
  pull_request:

# Two jobs, split by one question: does the answer depend on which interpreter is
# running? The suite does, so it runs on every version `requires-python` admits. Lint,
# the version check and the installer's own tests do not — `ruff` reads its target from
# `pyproject.toml`, `shellcheck` reads bash, and `check_version.py` compares strings —
# so running them four times would only buy four identical answers and four minutes.
#
# The same question decides the operating system, and gives a different answer. What
# can differ on macOS is not the interpreter but the platform underneath it: `termios`
# and `/dev/tty` for the wizard, file modes, path handling, and which `ffmpeg` binary
# `imageio-ffmpeg` unpacks. None of that varies with the Python version, so macOS gets
# **one** job rather than a second column — a full cross-product would buy three more
# answers to a question already answered.
jobs:
  test:
    name: test (py${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every version gets its answer. Stopping at the first failure hides whether the
      # break is "3.14 only" or "everything past 3.11", which is the first thing anyone
      # would want to know — and the same goes for "macOS only".
      fail-fast: false
      matrix:
        # `pyproject.toml` says `requires-python = ">=3.11"`, and until this matrix
        # existed only 3.11 had ever run — a promise about four interpreters, checked
        # on one. Adding a release here is the whole cost of admitting it.
        python: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        # One macOS job, on the floor `requires-python` names. It is here for the
        # platform, not the interpreter: this is the only place `termios`, `/dev/tty`,
        # the keychain path and a non-Linux `ffmpeg` are exercised at all.
        include:
          - python: "3.11"
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Sync
        run: uv sync
      - name: Test (offline — no creds, no network)
        run: uv run pytest -q -m "not live"

  # The optional observability extra, on one interpreter. It is here for the *dependency*
  # rather than for the interpreter, which is the same question the matrix above answers
  # for Python and the macOS job answers for the platform: what differs is whether the
  # OpenTelemetry SDK is installed, and that does not vary with the version running it.
  #
  # Both halves are checked, and the matrix job above is one of them: without the extra
  # it proves the CLI works and degrades to a no-op, since `tests/test_telemetry.py`
  # skips only the tests that need real spans. This job proves the signals are actually
  # produced. A single job installing the extra would leave the more common
  # configuration — nobody has it installed — untested.
  telemetry:
    name: test (otel extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Sync (with the otel extra)
        run: uv sync --extra otel
      - name: Test (offline — no creds, no collector)
        run: uv run pytest -q -m "not live"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so the version check below has the released versions to compare
          # against. A shallow checkout fetches none, which would make it vacuous.
          fetch-depth: 0

      # First, because it needs nothing installed and is the one failure that is
      # cheaper to see before the suite than after it.
      - name: Check the version only goes forwards
        run: python3 scripts/check_version.py

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Sync
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Lint the workflows
        run: uv run actionlint

      - name: Lint the installer
        run: uv run shellcheck install/install.sh install/test_installer.sh packaging/build.sh
      - name: Installer unit tests
        run: bash install/test_installer.sh
      - name: Installer smoke test (no network, no install)
        run: |
          bash install/install.sh --dry-run                    # the default: a bundle
          bash install/install.sh --dry-run --version main     # a git ref: from source

  # The standalone bundle — the default way this CLI gets installed, and the one thing
  # in the repo that no other job exercises at all. It is built here rather than only at
  # release time because everything it can get wrong is invisible from a normal test
  # run: a manifest that did not get collected, an adapter that static analysis could
  # not see behind a string, an ffmpeg that arrived without its execute bit. Each of
  # those produces a bundle that starts, answers `--version`, and then fails on the
  # first real command — which is a bad thing to discover from a published tag.
  #
  # **Two operating systems, because the shell is not the same one.** This job used to
  # run on Linux alone, on the reasoning that what varies across the release matrix is
  # the runner rather than the spec file. That was wrong in a way that cost a release:
  # macOS ships bash 3.2, which parses `$var…` differently from bash 5, so
  # `packaging/build.sh` died on both macOS runners at a line every Linux job had run
  # happily for days — and the first thing to execute it under macOS bash was a release.
  # `tests/test_packaging.py` now catches that exact shape statically, but the general
  # lesson does not fit in a regex: `build.sh` and `install.sh` are shell, and BSD
  # userland is a different platform however carefully they are written.
  #
  # Both architectures are *not* built here. What is arch-specific — the bootloader, the
  # ad-hoc signature arm64 insists on, which ffmpeg `imageio-ffmpeg` unpacks — is covered
  # by the release matrix, and a failure there refuses to publish rather than publishing
  # something broken. What is *OS*-specific is the shell and the BSD tools, and one macOS
  # runner exercises those as well as two. arm64 is the one chosen because signature
  # enforcement there is the stricter of the two.
  #
  # The Linux row is ubuntu-22.04 rather than -latest, for the reason the release builds
  # on it: a bundle links the glibc it was built against, so building on the newest
  # runner would produce something that refuses to start on any slightly older
  # distribution.
  standalone:
    name: standalone bundle (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    strategy:
      # "Linux only" and "both" are different diagnoses, and stopping at the first
      # failure hides which one it is.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, triple: linux-x86_64 }
          - { os: macos-14,     triple: macos-arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # `--python 3.12` because ubuntu-22.04's own python3 is 3.10, below the floor
      # `requires-python` sets; uv fetches a matching interpreter on either platform. The
      # step ends with a smoke test of the bundle it just produced — an image through
      # Pillow, a clip and an animation through the bundled ffmpeg, `doctor`, and a span
      # exported through the frozen OpenTelemetry SDK.
      - name: Build
        run: bash packaging/build.sh --output dist --python 3.12

      # And then install it the way a user would, from the tarball rather than from the
      # build directory. This is the only thing that covers the unpack, the symlink flip
      # and the bundled installer `upgrade` will later run — and the only place the
      # bundle is asked what kind of installation it thinks it is, which is the question
      # `upgrade` and `uninstall` both branch on. On the macOS row it is also the only
      # place `install.sh` itself is executed by bash 3.2 rather than merely linted.
      #
      # The command's name is read out of pyproject rather than spelled out, the way
      # release.yml reads it, so a rebranded fork does not fail here on an assertion
      # about a name it deliberately changed. sed rather than an interpreter: nothing is
      # installed in this job.
      - name: Install it and check what it says about itself
        run: |
          set -euo pipefail
          cli="$(sed -n 's/^name = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          # So the installer's closing PATH check finds the command it just linked. The
          # check only warns now, so this is about the `"$cli" --version` below rather
          # than about the install succeeding.
          export PATH="$HOME/.local/bin:$PATH"
          bash install/install.sh --from-file dist/*.tar.gz --no-init --bin-dir "$HOME/.local/bin"
          "$cli" --version
          "$cli" version show > report.json
          grep -q '"method": "standalone"' report.json || {
            echo "::error::the installed bundle does not report itself as a standalone install"
            cat report.json
            exit 1
          }
