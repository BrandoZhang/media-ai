name: release

# Cutting a release by hand means bumping a version, remembering which files carry
# it, tagging, and writing notes — four chances to get it wrong, and the one that
# matters (tagging a commit whose tests were never run) is invisible until someone
# installs it. This does all of it from one button, and refuses to tag a red tree.
#
# Run it from the Actions tab: "release" → "Run workflow" → the new version, e.g.
# 0.3.0. Tick "dry run" first to see exactly what it would do.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, without the leading v (e.g. 0.3.0)"
        required: true
        type: string
      dry_run:
        description: "Do everything except push the tag and publish the release"
        type: boolean
        default: false

# The tag, the commit and the release are all pushed with GITHUB_TOKEN.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the release notes are generated by diffing against the
          # previous tag, which a shallow clone does not have.
          fetch-depth: 0

      - name: Check the inputs and the starting state
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Matches tests/test_version.py, which enforces the same shape in CI.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' is not MAJOR.MINOR.PATCH — pass 0.3.0, not v0.3.0"
            exit 1
          fi
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::run this from ${{ github.event.repository.default_branch }}; it tags whatever ref it runs on"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Sync
        run: uv sync

      # The whole point of releasing from CI: the tag can only land on a tree that
      # passed everything, including the installer's own checks.
      - name: Lint
        run: uv run ruff check src tests

      - name: Test (offline — no creds, no network)
        run: uv run pytest -q -m "not live"

      - name: Lint the installer
        run: shellcheck install/install.sh install/test_parse.sh

      - name: Installer unit tests
        run: bash install/test_parse.sh

      - name: Installer smoke test (no network, no install)
        run: bash install/install.sh --dry-run --version main

      - name: Bump the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Two files: the one declaration (pyproject reads it) and the installer's
          # fallback git ref, which is a tag name rather than a package version.
          # tests/test_version.py fails if they ever disagree, and it runs below.
          python - <<'PY'
          import os, pathlib, re
          version = os.environ["VERSION"]
          init = pathlib.Path("src/media_ai/__init__.py")
          init.write_text(
              re.sub(r'^__version__ = ".*"$', f'__version__ = "{version}"', init.read_text(), flags=re.M)
          )
          sh = pathlib.Path("install/install.sh")
          sh.write_text(
              re.sub(
                  r'^DEFAULT_VERSION="\$\{MEDIA_AI_DEFAULT_VERSION:-[^}]+\}"$',
                  f'DEFAULT_VERSION="${{MEDIA_AI_DEFAULT_VERSION:-v{version}}}"',
                  sh.read_text(),
                  flags=re.M,
              )
          )
          PY
          git --no-pager diff --stat

      - name: Check the bump landed everywhere
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          uv run pytest -q tests/test_version.py
          got="$(uv run media-ai --version)"
          [ "$got" = "media-ai $VERSION" ] || { echo "::error::CLI reports '$got'"; exit 1; }

      - name: Build the distributions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          uv build
          # The wheel name is the version setuptools actually read; if the bump had
          # only landed in a comment this is where it shows.
          ls "dist/media_ai-$VERSION-py3-none-any.whl" "dist/media_ai-$VERSION.tar.gz"

      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "v$VERSION"

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 0.x is published as a pre-release: the CLI's own setup banner says the
          # interfaces can still change, and install.sh already lists releases rather
          # than asking for /releases/latest precisely so pre-releases are found.
          flags=(--title "v$VERSION" --generate-notes --verify-tag)
          case "$VERSION" in 0.*) flags+=(--prerelease) ;; esac
          gh release create "v$VERSION" dist/* "${flags[@]}"

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "### Dry run — nothing was pushed"
              echo
              echo "\`v$VERSION\` would have been tagged on \`${{ github.sha }}\` and released."
            else
              echo "### Released [v$VERSION](${{ github.server_url }}/${{ github.repository }}/releases/tag/v$VERSION)"
              echo
              echo '```bash'
              echo "curl -fsSL ${{ github.server_url }}/${{ github.repository }}/raw/v$VERSION/install/install.sh | bash"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
