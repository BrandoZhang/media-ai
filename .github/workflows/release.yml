name: release

# Releases follow the version in the repo. Merge a pull request that bumps
# `media_ai.__version__` and this tags it and publishes a pre-release; merge anything
# else and it exits green having done nothing.
#
# The trigger is "the version has no tag yet" rather than "the version line changed in
# this push". That is idempotent — a re-run, a failed run, a squash merge and a
# force-push all reach the same answer — and it means a release can also be started by
# creating the tag, or recovered by re-running the job.
#
# What stays a human decision is the *number*: nothing can infer from a diff whether a
# change is 0.2.1 or 0.3.0. Bump it in the pull request, where it gets reviewed:
#
#     python scripts/bump_version.py 0.3.0
#
# The *direction* is not a decision — ci.yml fails any pull request whose version is
# behind a released tag, so a bad merge or a bump written against a stale branch is
# caught while it is still a pull request rather than after it has been tagged.
#
# "Run workflow" in the Actions tab does the bump for you, for a release that does not
# need a pull request. That path commits to the default branch; the automatic one only
# ever creates a tag.
#
# A release carries the wheel *and* four standalone bundles — the tarballs
# `install/install.sh` downloads by name, one per (OS, architecture). They are built
# before the release exists rather than attached afterwards, which is what the three-job
# shape below is for; see the note on `plan`.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Bump to this version first, without the leading v (e.g. 0.3.0). Blank = release the version already in the repo."
        required: false
        type: string
      dry_run:
        description: "Do everything except push the tag and publish the release"
        type: boolean
        default: false

# The tag, the commit and the release are all pushed with GITHUB_TOKEN.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Three jobs, and the split is about *ordering the assets*, not about parallelism.
  #
  # A release is published with the standalone bundles already attached, because the
  # installer's default path downloads one by name: a release that exists for the ten
  # minutes it takes four runners to build would answer 404 to everybody who installed
  # in that window, and the `version check` feed would already be pointing at it. So
  # `plan` decides whether there is anything to release at all (cheap, and the ordinary
  # answer on a push to the default branch is "no"), `bundle` builds the four platforms
  # only when there is, and `release` runs the checks, tags, and publishes the wheel and
  # the bundles together.
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so "is this version already released" and the version-direction check
          # below have something to compare against.
          fetch-depth: 0

      - name: Work out whether there is anything to release
        id: plan
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            # Shape is not checked here: the next step rejects anything that is not a
            # version, with one regex living in scripts/check_version.py rather than
            # a copy of it in every file that handles a version string.
            version="$REQUESTED"
          else
            # The version already committed. sed rather than importing the package,
            # because nothing is installed yet at this point in the job.
            version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/media_ai/__init__.py)"
            if [ -z "$version" ]; then
              echo "::error::could not read __version__ from src/media_ai/__init__.py"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            # The ordinary case for a push: this version shipped already, so the merge
            # was not a release. Not a failure — there is simply nothing to do.
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already tagged; nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      # Also a pull-request check, so on the automatic path this is a formality — but
      # the dispatch path takes a version straight from a form field, and nothing else
      # would stop that one from being malformed or going backwards.
      - name: Check the version only goes forwards
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: python3 scripts/check_version.py "$VERSION"

      - name: Check the branch
        if: steps.plan.outputs.release == 'true'
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::run this from ${{ github.event.repository.default_branch }}; it tags whatever ref it runs on"
            exit 1
          fi

  # One bundle per platform, built on the platform — a frozen build carries a compiled
  # interpreter, Pillow's extension modules and an ffmpeg, none of which cross-compile.
  #
  # The Linux runners are the *oldest* supported images rather than `-latest`, because a
  # bundle links the glibc it was built against and will refuse to start on anything
  # older. Building on 24.04 would silently drop Ubuntu 22.04, Debian 12 and every
  # long-lived container base image; building on 22.04 costs nothing and covers them.
  # macOS is split by architecture for the same non-negotiable reason, not for coverage:
  # a Rosetta-less arm64 Mac cannot run an x86_64 bundle and vice versa.
  #
  # These labels are the ones GitHub still offers, which is not a stable set — Intel
  # macOS images in particular get retired. When one disappears, `actionlint` says so on
  # the next pull request; move it to the oldest label still listed rather than to
  # `-latest`, which is how the glibc floor above quietly rises.
  #
  # `fail-fast: false` because "which platform did not build" is the first thing anyone
  # would want to know, and `release` needs all four anyway — it names each one before
  # it publishes.
  bundle:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    name: bundle (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     triple: linux-x86_64 }
          - { os: ubuntu-22.04-arm, triple: linux-arm64 }
          - { os: macos-15-intel,   triple: macos-x86_64 }
          - { os: macos-14,         triple: macos-arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # The same bump the release job does, and for the same reason: what gets built has
      # to be what gets tagged. A no-op on the automatic path, where the version is
      # already in the tree.
      - name: Bump the version
        if: inputs.version != ''
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python3 scripts/bump_version.py "$VERSION"

      # `--python 3.12` rather than the runner's own: ubuntu-22.04 ships 3.10, below the
      # floor `requires-python` sets. The build ends by running the bundle it produced —
      # an image, a clip, an animation through the bundled ffmpeg, and `doctor` — so a
      # platform whose bundle does not work fails here rather than after the tag exists.
      - name: Build
        run: bash packaging/build.sh --output dist --python 3.12

      - name: Check it is named for this platform
        env:
          TRIPLE: ${{ matrix.triple }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          cli="$(sed -n 's/^name = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          ls "dist/$cli-$VERSION-$TRIPLE.tar.gz" "dist/$cli-$VERSION-$TRIPLE.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [plan, bundle]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      # Re-exported so the steps below read one name rather than a `needs.` path each
      # time; `steps.plan.outputs.version` used to be that name.
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the release notes are generated by diffing against the
          # previous tag, which a shallow clone does not have.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Sync
        run: uv sync

      # Bumped before the checks run, so what gets tested is exactly what gets tagged.
      # A no-op when the version is already in the repo, which is the automatic path.
      - name: Bump the version
        run: |
          set -euo pipefail
          # A script rather than an inline heredoc: this step would otherwise be three
          # levels of quoting deep (YAML block scalar → shell → Python), and the
          # inline version broke the whole workflow file — an f-string's escaped brace
          # produced a dollar-brace-brace sequence, which GitHub reads as one of its
          # own expressions wherever it appears, comments included.
          python scripts/bump_version.py "$VERSION"
          git --no-pager diff --stat

      # The whole point of releasing from CI: the tag can only land on a tree that
      # passed everything, including the installer's own checks.
      - name: Lint
        run: uv run ruff check .

      - name: Test (offline — no creds, no network)
        run: uv run pytest -q -m "not live"

      - name: Lint the workflows
        run: uv run actionlint

      - name: Lint the installer
        run: uv run shellcheck install/install.sh install/test_installer.sh packaging/build.sh

      - name: Installer unit tests
        run: bash install/test_installer.sh

      - name: Installer smoke test (no network, no install)
        run: |
          bash install/install.sh --dry-run                    # the default: a bundle
          bash install/install.sh --dry-run --version main     # a git ref: from source

      - name: Check the version reaches the CLI
        run: |
          set -euo pipefail
          # The command's name is a build-time constant (src/media_ai/brand.py), pinned
          # to this key by tests/test_brand.py. Read it rather than spelling it out, so
          # a rebranded fork's first release does not fail on an assertion about a name
          # it deliberately changed.
          cli="$(uv run python -c 'import tomllib,pathlib;
          print(next(iter(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["scripts"])))')"
          got="$(uv run "$cli" --version)"
          [ "$got" = "$cli $VERSION" ] || { echo "::error::CLI reports '$got', expected '$cli $VERSION'"; exit 1; }

      - name: Build the distributions
        run: |
          set -euo pipefail
          uv build
          # The wheel name is the version setuptools actually read; if the bump had
          # only landed in a comment this is where it shows.
          ls "dist/media_ai-$VERSION-py3-none-any.whl" "dist/media_ai-$VERSION.tar.gz"

      # Into the same directory the wheel went, so one `gh release create dist/*`
      # publishes everything the release has to carry.
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist

      - name: Check every platform's bundle arrived
        run: |
          set -euo pipefail
          cli="$(sed -n 's/^name = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          # Named one by one rather than counted: a count passes when the same platform
          # is present twice, and the point of the check is that nobody's install
          # one-liner starts answering 404 the day a runner image breaks.
          for triple in linux-x86_64 linux-arm64 macos-x86_64 macos-arm64; do
            ls "dist/$cli-$VERSION-$triple.tar.gz" "dist/$cli-$VERSION-$triple.tar.gz.sha256"
          done

      - name: Commit the bump
        # Only the dispatch-with-a-version path has anything to commit. The automatic
        # path releases a version that is already on the branch, so it never writes to
        # the default branch — which is also what keeps it clear of branch protection.
        if: ${{ !inputs.dry_run && inputs.version != '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git push origin HEAD:"${{ github.ref_name }}"

      - name: Tag
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      # Written whether or not the release is published, so a dry run shows it too —
      # this is the part of the notes a human is meant to read before merging.
      #
      # This runs *after* the tag exists, which is fine and is not something to fix by
      # moving the step: compat_notes.py compares against the highest tag below the
      # version in the tree, precisely because the two recovery paths in this file's
      # header (start a release by creating the tag; re-run a half-finished job) reach
      # it with the tag already pushed whatever the order here.
      - name: Compatibility notes
        id: compat
        run: |
          set -euo pipefail
          python scripts/compat_notes.py > compat.md
          if [ -s compat.md ]; then
            cat compat.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No file format or floor changed in this release." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The notes are assembled here rather than left to `--generate-notes`, because
          # the compatibility section has to come *first* — it is the part that says
          # whether upgrading costs anything, and a reader who stops at the changelog
          # has stopped before it. Asking the API for the generated half and
          # concatenating is also one less thing to be wrong about than relying on how
          # two note flags combine, on a step that only ever runs at release time.
          gh api --method POST \
            "repos/${{ github.repository }}/releases/generate-notes" \
            -f "tag_name=v$VERSION" --jq .body > generated.md
          cat compat.md generated.md > notes.md
          # 0.x is published as a pre-release: the CLI's own setup banner says the
          # interfaces can still change, and install.sh already lists releases rather
          # than asking for /releases/latest precisely so pre-releases are found.
          flags=(--title "v$VERSION" --notes-file notes.md --verify-tag)
          case "$VERSION" in 0.*) flags+=(--prerelease) ;; esac
          gh release create "v$VERSION" dist/* "${flags[@]}"

      - name: Summary
        run: |
          {
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "### Dry run — nothing was pushed"
              echo
              echo "v$VERSION would have been tagged on ${{ github.sha }} and released."
            else
              echo "### Released [v$VERSION](${{ github.server_url }}/${{ github.repository }}/releases/tag/v$VERSION)"
              echo
              echo '```bash'
              echo "curl -fsSL ${{ github.server_url }}/${{ github.repository }}/raw/v$VERSION/install/install.sh | bash"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
