# ------------------------------------------------------------------ Seedance 2.0

[[binding]]
id       = "volc-ark/seedance-2.0"
model    = "seedance-2.0"
model_id = "doubao-seedance-2-0-260128"
title    = "Seedance 2.0"
scenes   = [
  "video.text_to_video",
  "video.image_to_video",
  "video.keyframe_to_video",
  "video.reference_to_video",
]
verified = "2026-07-28"
notes = [
  "a blocking wait cancels the billed task on SIGTERM/SIGINT/timeout so a killed call leaves nothing running",
  "durations are model-version specific and left to the API to validate",
]

[binding.constraints]
options = ["camera_fixed", "watermark"]

[binding.constraints.supports]
seed              = true
audio             = true
negative_prompt   = true
first_frame       = true
last_frame        = true
reference_images  = true
reference_videos  = true
reference_audios  = true
watermark_control = true
return_last_frame = true
cancel            = true

[binding.constraints.geometry]
mode          = "aspect_ratio"
resolutions   = ["480p", "720p", "1080p"]
aspect_ratios = ["16:9", "9:16", "1:1", "4:3", "3:4", "21:9", "adaptive"]

[binding.constraints.video]
async = true

