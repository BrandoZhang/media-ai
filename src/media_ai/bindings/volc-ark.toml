# Volcengine Ark — Doubao Seedream (image) + Seedance (video).
#
# Four bindings, one endpoint, four different sets of limits. The three Seedream
# models share `POST /images/generations` and the same auth, yet differ in every
# constraint that matters: resolution tiers, output formats, whether group output
# works, reference ceilings, pixel floors. That is why constraints live per binding.
#
# Model IDs are account-specific and must be enabled in the console first:
# https://www.volcengine.com/docs/82379/1330310

[provider]
name       = "volc-ark"
title      = "Volcengine Ark"
transport  = "http"
adapter    = "media_ai.providers.volc_ark:VolcArkAdapter"
docs       = "https://www.volcengine.com/docs/82379/1330310"
setup_hint = "Enable the model in the Ark console, then create an API key. Model IDs are per-account."

[provider.auth]
kind   = "api_key"
header = "Authorization"
scheme = "Bearer"
env    = ["ARK_API_KEY", "VOLC_API_KEY"]

[provider.base_url]
default      = "https://ark.cn-beijing.volces.com/api/v3"
configurable = true

# ---------------------------------------------------------------- Seedream 5.0 pro

[[binding]]
id       = "volc-ark/seedream-5.0-pro"
model    = "seedream-5.0-pro"
model_id = "doubao-seedream-5-0-pro-260628"
title    = "Seedream 5.0 Pro"
scenes   = ["image.text_to_image", "image.image_to_image"]
verified = "2026-07-28"
notes    = [
  "interactive editing: mark a region on the input image, or write <point>/<bbox> tags into the prompt",
  "TODO: 'single image / multiple layers' output is documented without a wire field — left undeclared",
  "documented standard ratios (1:1 4:3 3:4 16:9 9:16 3:2 2:3 21:9) are examples, not an enum — the vendor states supported ratios are not limited to them, so only ratio_range gates",
]

[binding.constraints]
options = ["watermark", "optimize_prompt_mode", "response_format"]

[binding.constraints.supports]
seed             = true
interactive_edit = true
group_output     = false
streaming        = false
grounding        = false

[binding.constraints.geometry]
mode            = "both"
named_sizes     = ["1K", "2K"]
pixel_total_min = 921600
pixel_total_max = 4624220
ratio_range     = [0.0625, 16.0]

[binding.constraints.output]
formats   = ["png", "jpeg"]
max_count = 1

[binding.constraints.references]
max         = 10
formats     = ["jpeg", "png", "webp", "bmp", "tiff", "gif", "heic", "heif"]
max_bytes   = 31457280
max_pixels  = 36000000
min_edge    = 15
ratio_range = [0.0625, 16.0]

# ------------------------------------------------------------------- Seedream 5.0

[[binding]]
id       = "volc-ark/seedream-5.0"
model    = "seedream-5.0"
model_id = "doubao-seedream-5-0-260128"
title    = "Seedream 5.0"
scenes   = ["image.text_to_image", "image.image_to_image"]
verified = "2026-07-28"
notes    = [
  "group output is budgeted jointly with inputs: references + generated images <= 15",
  "an account-specific endpoint id can be configured with `extends = \"volc-ark/seedream-5.0\"`",
  "TODO: the web-search toggle is documented without a wire field name — left undeclared",
  "documented standard ratios (1:1 4:3 3:4 16:9 9:16 3:2 2:3 21:9) are examples, not an enum — the vendor states supported ratios are not limited to them, so only ratio_range gates",
]

[binding.constraints]
options = ["watermark", "response_format", "stream"]

[binding.constraints.supports]
seed             = true
interactive_edit = false
group_output     = true
streaming        = true
grounding        = true

[binding.constraints.geometry]
mode          = "both"
named_sizes   = ["2K", "3K", "4K"]
ratio_range   = [0.0625, 16.0]

[binding.constraints.output]
formats          = ["png", "jpeg"]
max_count        = 15
max_total_images = 15

[binding.constraints.references]
max         = 14
formats     = ["jpeg", "png", "webp", "bmp", "tiff", "gif", "heic", "heif"]
max_bytes   = 31457280
max_pixels  = 36000000
min_edge    = 15
ratio_range = [0.0625, 16.0]

