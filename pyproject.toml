[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "media-ai"
version = "0.2.0"
description = "Provider- and model-agnostic multimodal generation CLI (mock + Volcengine Ark + OpenAI + Google Gemini) with capability discovery, structured errors, secret-safe credentials, and token-cost accounting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pillow>=10.1",
    "imageio-ffmpeg>=0.4",
]

[project.scripts]
media-ai = "media_ai.__main__:main"
# legacy compatibility shims (existing Agent Skills keep working)
text2image = "media_ai.cli.legacy:text2image"
image2image = "media_ai.cli.legacy:image2image"
text2video = "media_ai.cli.legacy:text2video"
image2video = "media_ai.cli.legacy:image2video"
ref2video = "media_ai.cli.legacy:ref2video"
concat_video = "media_ai.cli.legacy:concat_video"
video_task = "media_ai.cli.legacy:video_task"
media_usage = "media_ai.cli.legacy:media_usage"

[project.optional-dependencies]
test = ["pytest>=7"]
keychain = ["keyring>=24"]

# Dev tooling for the uv workflow (installed by default by `uv sync`).
# The `test` extra above is kept for the pip / CI path.
[dependency-groups]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.setuptools]
packages = [
    "media_ai",
    "media_ai.core",
    "media_ai.credentials",
    "media_ai.providers",
    "media_ai.media",
    "media_ai.cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real provider APIs; skipped unless MEDIA_LIVE_TESTS=1 and the provider's key is set",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402", "E741"]
