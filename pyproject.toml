[build-system]
# >=62.3 for recursive `**` globs in package-data (used to ship skills/).
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"

[project]
name = "media-ai"
version = "0.2.0"
description = "Provider- and model-agnostic multimodal generation CLI (image/video/audio across mock + Volcengine Ark + OpenAI + Google Gemini + ElevenLabs) with capability discovery, structured errors, secret-safe credentials, and token-cost accounting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pillow>=10.1",
    "imageio-ffmpeg>=0.4",
]

[project.scripts]
media-ai = "media_ai.__main__:main"

[project.optional-dependencies]
test = ["pytest>=7"]
keychain = ["keyring>=24"]

# Dev tooling for the uv workflow (installed by default by `uv sync`).
# The `test` extra above is kept for the pip / CI path.
[dependency-groups]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

# Agent Skills ship *inside* the package so `uv tool install git+https://…` carries
# them; `media-ai init` copies them out to the user's agent directory. Without this
# they'd be repo-only files and an installed CLI could not offer skill installation.
[tool.setuptools.package-data]
media_ai = ["skills/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real provider APIs; skipped unless MEDIA_LIVE_TESTS=1 and the provider's key is set",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402", "E741"]
