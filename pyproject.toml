[build-system]
# >=62.3 for recursive `**` globs in package-data (used to ship skills/).
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name, and below it the executable's. Both are the brand, and both
# have to be spelled out here because this file is static — so `tests/test_brand.py`
# pins them to `media_ai.brand.CLI_NAME`, the way `tests/test_version.py` pins the
# installer's fallback ref to `media_ai.__version__`. A rebrand edits `brand.py`,
# these two lines, and `CLI_NAME` in `install/install.sh`; nothing else in the tree
# names the tool. `uv tool` keys installs by *distribution* name, so renaming that
# too is what lets two builds coexist rather than replace each other.
name = "media-ai"
# Read from `media_ai.__version__` (see [tool.setuptools.dynamic] below) so the
# version lives in exactly one place. setuptools parses that assignment statically,
# so nothing here imports the package at build time.
dynamic = ["version"]
description = "Provider- and model-agnostic multimodal generation CLI (image/video/audio across mock + Volcengine Ark + OpenAI + Google Gemini + ElevenLabs) with capability discovery, structured errors, secret-safe credentials, and token-cost accounting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pillow>=10.1",
    "imageio-ffmpeg>=0.4",
]

[project.scripts]
# The import package stays `media_ai` under every brand: it is the resource root for
# `skills/` and `bindings/`, and the entry-point group third-party manifests register
# under (`media_ai.bindings`). A distribution whose name differs from its import name
# is ordinary; renaming the import package would break every plugin for no gain.
media-ai = "media_ai.__main__:main"

[project.optional-dependencies]
test = ["pytest>=7"]
keychain = ["keyring>=24"]
# Observability (docs/OBSERVABILITY.md). An extra, not a dependency: this CLI depends
# on Pillow and a bundled ffmpeg and nothing else, an install that never exports should
# not carry a tree several times its own size, and an install that cannot reach an index
# should still generate images. With telemetry off the SDK is never imported; with it on
# and the SDK absent the CLI degrades to a no-op and says so in `notices[]`.
# The floor is 1.20 for the stable OTLP/HTTP exporter entry points this uses.
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

# Dev tooling for the uv workflow (installed by default by `uv sync`).
# The `test` extra above is kept for the pip / CI path.
#
# `shellcheck-py` is here for the same reason `actionlint-py` is: the alternative is the
# runner's system binary, which drifts. Two CI failures on this repo have been a
# shellcheck version disagreeing with the one on a laptop — the codes move between
# releases (an overridden function is SC2317 in 0.10 and SC2329 in 0.11) and so does the
# severity. Pinning it through the same lockfile everything else uses is what makes
# `uv run shellcheck …` locally and in CI the same command.
[dependency-groups]
dev = ["pytest>=7", "ruff>=0.6", "actionlint-py>=1.7", "shellcheck-py>=0.10"]

[tool.setuptools.dynamic]
version = { attr = "media_ai.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Agent Skills ship *inside* the package so `uv tool install git+https://…` carries
# them; `media-ai init` copies them out to the user's agent directory. Without this
# they'd be repo-only files and an installed CLI could not offer skill installation.
# Binding manifests ship the same way for a stronger reason: they *are* the
# capability declaration the CLI reads at runtime, so an install without them knows
# about no models at all.
[tool.setuptools.package-data]
media_ai = ["skills/**/*.md", "bindings/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Dump every thread's traceback when one test has been running for two minutes.
#
# This exists because a macOS job hung twice in the `pty.fork()` tests and both times
# said nothing at all: pytest stops emitting, the runner kills the job at its
# `timeout-minutes`, and the log ends mid-progress-bar. Two occurrences bought two
# different progress percentages and no name — the first cost six hours of a runner and
# a speculative fix that turned out not to be the cause, which is the expensive way to
# learn that "somewhere in this block" is not a diagnosis.
#
# `faulthandler` is stdlib and the plugin is built into pytest, so this costs nothing to
# carry. Two minutes is ~24x the slowest test here (the pty ones, ~5s) against a suite
# that finishes in 70 seconds, so a loaded runner cannot trip it by being slow.
#
# It deliberately does **not** set `faulthandler_exit_on_timeout`: dumping is the part
# that diagnoses, and aborting the process is a way to turn a slow runner into a red
# build. The job timeout already bounds the damage — this only makes the next one
# legible.
faulthandler_timeout = 120
markers = [
    "live: hits real provider APIs; skipped unless MEDIA_AI_LIVE_TESTS=1 and the provider's key is set",
    "spawns_refresh: allowed to fork a real background update check (see tests/conftest.py)",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# Beyond ruff's default (E4/E7/E9 + F): `I` because import order is the style
# argument that actually recurs in review and the one a machine settles for free;
# `UP` and `B` because they catch defects rather than taste — a lost exception
# chain (B904) or a `zip` that silently truncates (B905) are bugs, not layout.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E402",
    "E741",
    # `class Foo(str, Enum)` → `StrEnum` is not a refactor this codebase can take
    # casually: the two disagree on `__str__`/`__format__`, so every f-string and
    # `str()` over a Scene/ErrorCategory/Modality would switch from `Scene.IMAGE_GENERATE`
    # to `image.generate`. stdout is a machine contract (see AGENTS.md), and the
    # serialization sites deliberately spell `.value` — the mixin is load-bearing,
    # not legacy. Revisit only as its own change, with the JSON diffed.
    "UP042",
]
